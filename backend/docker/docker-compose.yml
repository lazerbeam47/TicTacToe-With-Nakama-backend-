services:
  postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: lila_ttt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nakama_net
 
  nakama:
    image: heroiclabs/nakama:3.22.0
    platform: linux/amd64
    container_name: lila_ttt_nakama
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - "/nakama/nakama migrate up --database.address postgres:localdb@lila_ttt_postgres:5432/nakama && exec /nakama/nakama --name lila_tictactoe --database.address postgres:localdb@lila_ttt_postgres:5432/nakama --logger.level INFO --session.token_expiry_sec 86400"
    environment:
      NAKAMA_CONSOLE_USERNAME: admin
      NAKAMA_CONSOLE_PASSWORD: adminpassword
      NAKAMA_SERVER_KEY: defaultkey
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    volumes:
      - ../lua:/nakama/data/modules
      - nakama_data:/nakama/data
    networks:
      - nakama_net
 
volumes:
  pgdata:
  nakama_data:
 
networks:
  nakama_net:
    driver: bridge
 
