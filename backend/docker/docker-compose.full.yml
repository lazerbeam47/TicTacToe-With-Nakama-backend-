version: "3.8"

# Full-stack compose: postgres + nakama + frontend nginx
# Usage: docker-compose -f docker-compose.full.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: lila_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nakama
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_net]

  nakama:
    image: heroiclabs/nakama:3.22.0
    container_name: lila_nakama
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up
          --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama &&
        exec /nakama/nakama
          --name lila_tictactoe
          --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama
          --logger.level INFO
          --session.token_expiry_sec 86400
    environment:
      NAKAMA_SERVER_KEY:      ${NAKAMA_SERVER_KEY:-defaultkey}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:-admin}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:-adminpassword}
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    volumes:
      - ../lua:/nakama/data/modules
      - nakama_data:/nakama/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7350/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [app_net]

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_NAKAMA_HOST:       ${NAKAMA_PUBLIC_HOST:-localhost}
        VITE_NAKAMA_PORT:       ${NAKAMA_PUBLIC_PORT:-7350}
        VITE_NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:-defaultkey}
        VITE_NAKAMA_SSL:        ${NAKAMA_SSL:-false}
    container_name: lila_frontend
    restart: unless-stopped
    depends_on:
      nakama:
        condition: service_healthy
    ports:
      - "80:80"
    networks: [app_net]

volumes:
  pgdata:
  nakama_data:

networks:
  app_net:
    driver: bridge
